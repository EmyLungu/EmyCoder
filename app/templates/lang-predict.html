{% extends "parts/base.html" %}

{% block title %}Language Predictor{% endblock %}

{% block content %}
<link href="{{ url_for('static', path='css/code.css') }}" rel="stylesheet">

<div id="main">
    <div id="left">
        <div class="input-code-nav">
            <h1 class="input-title" >Input</h1>
            <div id="model-select-container">
                <p style="margin: 0;">Select model:</p>
                <select id="model-select">
                    {% for model in models %}
                    <option value="{{model}}">{{model}}</option>
                    {% else %}
                    <h1>No models found</h1>
                    {% endfor %}
                </select>
            </div>
        </div>

        <textarea id="input-code" class="text-input"></textarea>

        <div class="input-code-nav" style="margin-top: 0.5em">
            {% include "parts/extract-code.html" %}
            <div class="btn-pannel">
                <button id="predict-all-btn" class="model-btn" type="button">Predict All</button>
                <button id="predict-btn" class="model-btn" type="button">Predict</button>
            </div>
        </div>
    </div>
    <div id="resizer-code" class="resizer"><div class="resizer-inner"></div></div>
    <div id="right">
        <h1>Output</h1>
        <h1 id="output" class="output-label">Lang</h1>
    </div>
</div>

<script type="module" src="{{ url_for('static', path='js/post-action.js') }}"></script> 
<script type="module" src="{{ url_for('static', path='js/code-input.js') }}"></script> 
<script type="module" src="{{ url_for('static', path='js/lang-predict.js') }}"></script> 
<script type="module" src="{{ url_for('static', path='js/code-extractor.js') }}"></script> 
<script type="module" src="{{ url_for('static', path='js/resizer.js') }}"></script> 
{% endblock %}
