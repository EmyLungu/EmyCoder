services:
  api:
    container_name: emycoder-api
    build:
      context: .
      dockerfile: ./api/Dockerfile
    ports:
      - "80:80"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - OLLAMA_BASE_URL=http://ollama:11434
    env_file:
      - .env
    volumes:
      - ./api:/code/app
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    depends_on:
      - mlflow
      - ollama
      - db
  
  db:
    image: postgres:18.4-alpine
    container_name: emycoder-db
    ports:
      - ${POSTGRESQL_PORT}:5432
    volumes:
      - emycoder-api-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${POSTGRESQL_DATABASE}
      - POSTGRES_USER=${POSTGRESQL_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}

  frontend:
    container_name: emycoder-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - ./VERSION:/VERSION
      - /app/node_modules
    command: npm run dev
    depends_on:
      - api

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.11.1
    container_name: emycoder-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_data:/mlflow_data
    command: >
      mlflow server 
      --backend-store-uri sqlite:////mlflow_data/mlflow.db 
      --default-artifact-root mlflow-artifacts:/
      --artifacts-destination /mlflow_data/artifacts 
      --serve-artifacts
      --host 0.0.0.0
      --allowed-hosts "*"

  ollama:
    image: ollama/ollama:latest
    container_name: emycoder-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ./ollama_data:/root/.ollama
      - ./ollama:/root/models
  
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: "emycoder-tunnel"
  #   command: tunnel --url http://frontend:5173
  #   depends_on:
  #     - frontend
  #     - api

volumes:
  emycoder-api-db-data:
